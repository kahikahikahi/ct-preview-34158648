  function toggleNav(){

  document.addEventListener("click",function(e){
    var t=e.target.closest&&e.target.closest(".site-nav a, .site-order");
    if(t) closeNav();
  });
  addEventListener("resize",function(){if(window.innerWidth>=961)closeNav();});

  });
})();
