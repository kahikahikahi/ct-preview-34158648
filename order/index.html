<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
  <title>Order — Café Turquoise</title>
  <link rel="icon" href="../eye-sm.png" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      font-weight: 400;
    }
    main {
      max-width: 36rem;
      margin: 0 auto;
      padding: 40px 20px 64px;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 22px;
      font-weight: 400;
    }
    p { margin: 0 0 16px; }
    .ref { font-size: 1.35rem; letter-spacing: .04em; margin: 8px 0 20px; }
    a, a:visited, a:hover, a:active {
      color: #000;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .home { margin: 0 0 32px; }
    .act { margin-top: 28px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
    button {
      appearance: none;
      border: 0;
      background: #000;
      color: #fff;
      font: inherit;
      min-height: 48px;
      padding: 0 20px;
      cursor: pointer;
    }
    button[disabled] { opacity: .5; cursor: default; }
    .msg { min-height: 1.5em; }

    @media (prefers-color-scheme: dark) {
      html { color-scheme: dark; }
      html, body { background: #121212; color: #eaeaea; }
      a, a:visited, a:hover, a:active { color: #eaeaea; }
      button { background: #eaeaea; color: #121212; }
      button[disabled] { background: #2a2a2a; color: #9a9a9a; opacity: 1; }
      .msg { color: #eaeaea; }
    }
  </style>
</head>
<body>
  <main>
    <p class="home"><a href="../">Café Turquoise</a></p>
    <div id="content"></div>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var ref = (params.get("ref") || "").trim();
      var cancelled = params.get("cancelled") === "1";
      var rid = (params.get("rid") || "").trim();
      var sessionId = (params.get("session_id") || "").trim();
      var el = document.getElementById("content");
      var api = "https://nljzrxvfccxdcltbpava.supabase.co";
      var key = "sb_publishable_aXCPQakkbNccpChsgDGfWw_4XqKNZ2H";

      function escape(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
        });
      }
      function refLine() {
        return ref ? '<div class="ref">#' + escape(ref) + "</div>" : "";
      }

      if (cancelled) {
        el.innerHTML =
          "<h1>Payment cancelled</h1>" +
          refLine() +
          "<p>Your order is not paid. You can try again, or call us on <a href=\"tel:+6467578921\">06 757 8921</a>.</p>" +
          '<div class="act">' +
          (rid && ref ? '<button type="button" id="retry">Try paying again</button>' : "") +
          '<a href="../">Back to Café Turquoise</a>' +
          "</div>" +
          '<p class="msg" id="msg"></p>';
        var btn = document.getElementById("retry");
        if (btn) {
          btn.addEventListener("click", function () {
            btn.disabled = true;
            var msg = document.getElementById("msg");
            var base = new URL("../", location.href).href;
            fetch(api + "/functions/v1/create-checkout", {
              method: "POST",
              headers: { apikey: key, "Content-Type": "application/json" },
              body: JSON.stringify({ ref: ref, request_id: rid, return_base: base })
            }).then(function (r) {
              return r.json().catch(function () { return {}; }).then(function (j) {
                if (!r.ok || !j || !j.url) throw new Error((j && j.message) || "Sorry, that didn't go through. Please try again, or call us on 06 757 8921.");
                location.href = j.url;
              });
            }).catch(function (e) {
              btn.disabled = false;
              msg.textContent = e.message || "Please try again, or call us.";
            });
          });
        }
        return;
      }

      if (sessionId || ref) {
        el.innerHTML =
          "<h1>Payment received</h1>" +
          refLine() +
          "<p>Thank you. We’re confirming your payment and the café will start preparing your order.</p>" +
          "<p>Pickup is from 81 Devon Street West, New Plymouth.</p>" +
          '<p class="act"><a href="../">Back to Café Turquoise</a></p>';
        return;
      }

      el.innerHTML =
        "<h1>Order</h1>" +
        "<p>We couldn’t find that order. If you just paid, you can call us on <a href=\"tel:+6467578921\">06 757 8921</a>.</p>" +
        '<p class="act"><a href="../">Back to Café Turquoise</a></p>';
    })();
  </script>
</body>
</html>
