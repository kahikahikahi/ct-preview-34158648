<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Turquoise Orders" />
  <title>Café Turquoise Orders</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-180.png" />
  <link rel="stylesheet" href="./app.css?v=36" />
  <script defer src="./supabase-js-2.119.2.min.js"></script>
  <script defer src="../assets/libphonenumber-min.js?v=122"></script>
  <script defer src="../assets/phone.js?v=122"></script>
  <script defer src="./app.js?v=36"></script>
</head>
<body>
  <!-- Login -->
  <section id="screen-login" class="screen center" hidden>
    <form id="login-form" class="login" autocomplete="on">
      <input id="login-email" type="email" placeholder="Email" aria-label="Email" autocomplete="username" required />
      <input id="login-password" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required />
      <p id="login-error" class="error" hidden></p>
      <button type="submit" class="btn btn-dark btn-big" id="login-btn">Log in</button>
    </form>
  </section>

  <!-- Not staff -->
  <section id="screen-denied" class="screen center" hidden>
    <div class="login">
      <img src="./eye.png" alt="Café Turquoise" class="login-logo" width="120" height="120" />
      <p class="denied">This login doesn't have shop access.</p>
    </div>
  </section>


  <!-- Main app -->
  <section id="screen-app" class="screen app" hidden>
    <header class="topbar">
      <img src="./eye.png" alt="Café Turquoise" class="top-logo" width="44" height="44" />
      <span id="conn" class="conn ok">OPEN</span>
      <div class="top-right">
        <button type="button" class="cog-btn" id="settings-btn" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="panes">
      <div class="pane" id="pane-current">
        <div class="wrap" id="orders-list">
          <section class="group">
            <h2>New</h2>
            <div id="list-new" class="list"></div>
          </section>
          <section class="group">
            <h2>In progress</h2>
            <div id="list-progress" class="list"></div>
          </section>
          <section class="group">
            <h2>Bookings</h2>
            <div id="list-booked" class="list"></div>
          </section>
        </div>
        <div class="wrap" id="order-detail" hidden></div>
      </div>
      <div class="pane" id="pane-settings" hidden>
        <div class="wrap">
          <div class="settings-head">
          <button type="button" class="back-btn" id="settings-back-btn" aria-label="Back">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-8 7 8 7"/></svg>
          </button>
          <h2 class="settings-title" id="settings-title" hidden>Due</h2>
          </div>
          <div id="settings-main" class="settings">
            <div class="settings-total" id="today-total">
              <p class="settings-total-label">Today</p>
              <p class="settings-total-sum" id="today-total-sum">—</p>
              <p class="settings-total-n" id="today-total-n">Paid online orders</p>
            </div>
            <div class="settings-list">
              <button type="button" class="settings-row" id="test-print-btn">
                <span>Test print</span>
              </button>
              <button type="button" class="settings-row" id="due-btn">
                <span>Due</span>
                <svg class="settings-chev" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
              </button>
              <button type="button" class="settings-row" id="edit-menu-btn">
                <span>Edit menu</span>
                <svg class="settings-chev" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
              </button>
              <button type="button" class="settings-row" id="stop-btn" role="switch" aria-checked="true" aria-label="Receiving orders">
                <span id="stop-btn-label">Receiving orders</span>
                <span class="switch" aria-hidden="true"></span>
              </button>
            </div>
          </div>
          <div id="settings-menu" hidden>
            <p class="hint">Switch an item off when it runs out. Customers can't order it. It comes back on tomorrow, or you can switch it back on now.</p>
            <div id="menu-list" class="menu-list"></div>
          </div>
          <div id="settings-due" hidden>
            <div id="list-due" class="list"></div>
            <button type="button" class="more-btn" id="due-more" hidden>Show more</button>
          </div>
        </div>
      </div>
    </main>
  </section>

  <!-- Dialogs -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box" id="modal-box" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <div id="order-takeover" class="takeover" hidden data-act="view-incoming" role="button" tabindex="0">
    <p class="takeover-title">Order received</p>
    <p class="takeover-hint">Tap to view</p>
  </div>
</body>
</html>
