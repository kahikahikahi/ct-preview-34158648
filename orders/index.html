<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Turquoise Orders" />
  <title>Cafe Turquoise Orders</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-180.png" />
  <link rel="stylesheet" href="./app.css?v=8" />
  <script defer src="./supabase-js-2.119.2.min.js"></script>
  <script defer src="./app.js?v=8"></script>
</head>
<body>
  <!-- Login -->
  <section id="screen-login" class="screen center" hidden>
    <form id="login-form" class="login" autocomplete="on">
      <input id="login-email" type="email" placeholder="Email" aria-label="Email" autocomplete="username" required />
      <input id="login-password" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required />
      <p id="login-error" class="error" hidden></p>
      <button type="submit" class="btn btn-dark btn-big" id="login-btn">Log in</button>
    </form>
  </section>

  <!-- Not staff -->
  <section id="screen-denied" class="screen center" hidden>
    <div class="login">
      <img src="./eye.png" alt="Cafe Turquoise" class="login-logo" width="120" height="120" />
      <p class="denied">This login doesn't have shop access.</p>
      <button type="button" class="btn btn-big" data-action="signout">Log out</button>
    </div>
  </section>

  <!-- Tap to start (unlocks sound, keeps the screen awake) -->
  <section id="screen-start" class="screen center" hidden>
    <button type="button" id="start-btn" class="start-btn">
      <img src="./eye.png" alt="" width="120" height="120" />
      <span class="start-title">Tap to start</span>
      <span class="start-sub">Turns on the order sound and keeps the screen awake</span>
    </button>
  </section>

  <!-- Main app -->
  <section id="screen-app" class="screen app" hidden>
    <header class="topbar">
      <img src="./eye.png" alt="Cafe Turquoise" class="top-logo" width="44" height="44" />
      <nav class="tabs" role="tablist">
        <button type="button" class="tab" data-tab="current" role="tab">Orders <span class="count" id="count-orders" hidden></span></button>
        <button type="button" class="tab" data-tab="settings" role="tab">Settings</button>
      </nav>
      <div class="top-right">
        <span id="conn" class="conn">Connecting…</span>
        <button type="button" class="btn btn-small" data-action="signout">Log out</button>
      </div>
    </header>

    <main class="panes">
      <div class="pane" id="pane-current">
        <div class="wrap" id="orders-list">
          <section class="group">
            <h2>New</h2>
            <div id="list-new" class="list"></div>
          </section>
          <section class="group">
            <h2>In progress</h2>
            <div id="list-progress" class="list"></div>
          </section>
          <section class="group">
            <h2>Bookings coming up</h2>
            <div id="list-booked" class="list"></div>
          </section>
        </div>
        <div class="wrap" id="order-detail" hidden></div>
      </div>
      <div class="pane" id="pane-settings" hidden>
        <div class="wrap">
          <div id="settings-main" class="settings">
            <button type="button" class="btn btn-big" id="edit-menu-btn">Edit menu</button>
            <button type="button" class="btn btn-big btn-stop-line" id="stop-btn">Stop receiving orders</button>
            <p id="stop-note" class="hint"></p>
          </div>
          <div id="settings-menu" hidden>
            <button type="button" class="link-btn" id="menu-back-btn">Back</button>
            <p class="hint">Switch an item off when it runs out. Customers can't order it until you switch it back on.</p>
            <div id="menu-list" class="menu-list"></div>
          </div>
        </div>
      </div>
    </main>
  </section>

  <!-- Dialogs -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box" id="modal-box" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toast" class="toast" hidden></div>
</body>
</html>
