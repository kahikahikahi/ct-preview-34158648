<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Turquoise Orders" />
  <title>Cafe Turquoise Orders</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-180.png" />
  <link rel="stylesheet" href="./app.css?v=1" />
  <script defer src="./supabase-js-2.119.2.min.js"></script>
  <script defer src="./app.js?v=1"></script>
</head>
<body>
  <!-- Login -->
  <section id="screen-login" class="screen center" hidden>
    <form id="login-form" class="login" autocomplete="on">
      <img src="./logo.png" alt="Cafe Turquoise" class="login-logo" width="240" />
      <h1>Shop orders</h1>
      <label>Email<input id="login-email" type="email" autocomplete="username" required /></label>
      <label>Password<input id="login-password" type="password" autocomplete="current-password" required /></label>
      <p id="login-error" class="error" hidden></p>
      <button type="submit" class="btn btn-dark btn-big" id="login-btn">Log in</button>
    </form>
  </section>

  <!-- Not staff -->
  <section id="screen-denied" class="screen center" hidden>
    <div class="login">
      <img src="./logo.png" alt="Cafe Turquoise" class="login-logo" width="240" />
      <p class="denied">This login doesn't have shop access.</p>
      <button type="button" class="btn btn-big" data-action="signout">Log out</button>
    </div>
  </section>

  <!-- Tap to start (unlocks sound, keeps the screen awake) -->
  <section id="screen-start" class="screen center" hidden>
    <button type="button" id="start-btn" class="start-btn">
      <img src="./icon-192.png" alt="" width="120" height="120" />
      <span class="start-title">Tap to start</span>
      <span class="start-sub">Turns on the order sound and keeps the screen awake</span>
    </button>
  </section>

  <!-- Main app -->
  <section id="screen-app" class="screen app" hidden>
    <header class="topbar">
      <img src="./logo.png" alt="Cafe Turquoise" class="top-logo" />
      <nav class="tabs" role="tablist">
        <button type="button" class="tab" data-tab="orders" role="tab">Orders <span class="count" id="count-orders" hidden></span></button>
        <button type="button" class="tab" data-tab="bookings" role="tab">Bookings <span class="count" id="count-bookings" hidden></span></button>
        <button type="button" class="tab" data-tab="done" role="tab">Done today</button>
        <button type="button" class="tab" data-tab="menu" role="tab">Menu</button>
      </nav>
      <div class="top-right">
        <span id="conn" class="conn">Connecting…</span>
        <span id="clock" class="clock"></span>
        <button type="button" class="btn btn-small" data-action="signout">Log out</button>
      </div>
    </header>

    <button type="button" id="alert-bar" class="alert-bar" hidden></button>

    <main class="panes">
      <div class="pane" id="pane-orders">
        <div class="cols">
          <section class="col">
            <h2>New</h2>
            <div id="list-new" class="list"></div>
          </section>
          <section class="col">
            <h2>In progress</h2>
            <div id="list-progress" class="list"></div>
          </section>
        </div>
      </div>
      <div class="pane" id="pane-bookings" hidden>
        <div class="cols">
          <section class="col">
            <h2>Booking requests</h2>
            <div id="list-bk-pending" class="list"></div>
          </section>
          <section class="col">
            <h2>Coming up</h2>
            <div id="list-bk-upcoming" class="list"></div>
          </section>
        </div>
      </div>
      <div class="pane" id="pane-done" hidden>
        <div id="list-done" class="list list-wide"></div>
      </div>
      <div class="pane" id="pane-menu" hidden>
        <p class="hint">Switch an item off when it runs out. Customers can't order it until you switch it back on.</p>
        <div id="menu-list" class="menu-list"></div>
      </div>
    </main>
  </section>

  <!-- Dialogs -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box" id="modal-box" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toast" class="toast" hidden></div>
</body>
</html>
