<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <title>Delivery — Café Turquoise</title>
  <link rel="icon" href="../eye-sm.png" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 18px;
      line-height: 1.5;
      font-weight: 400;
    }
    header {
      position: relative;
      min-height: 64px;
    }
    .back {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .back svg {
      width: 22px;
      height: 22px;
      display: block;
    }
    header h1 {
      margin: 0;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0;
      text-align: center;
      padding: 0 64px;
    }
    @media (min-width: 821px) {
      .back { left: 32px; }
    }
    main {
      max-width: 36rem;
      margin: 0 auto;
      padding: 40px 20px 64px;
      text-align: center;
    }
    main p { margin: 0 0 20px; }
    main a, main a:visited, main a:hover, main a:active {
      color: inherit;
      font-weight: 400;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
    }
    @media (prefers-color-scheme: dark) {
      html { color-scheme: dark; }
      html, body { background: #000000; color: #eaeaea; }
    }
  </style>
</head>
<body>
  <header>
    <a class="back" href="../#order" aria-label="Back to ordering">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 12H3" />
        <path d="M9 5L2 12L9 19" />
      </svg>
    </a>
    <h1>Delivery</h1>
  </header>
  <main>
    <p><a href="https://www.delivereasy.co.nz/" target="_blank" rel="noopener">Delivereasy</a></p>
    <p><a href="https://www.ubereats.com/nz/search?q=Cafe%20Turquoise%20New%20Plymouth" target="_blank" rel="noopener">Uber Eats</a></p>
  </main>
</body>
</html>
